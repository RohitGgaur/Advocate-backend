<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>API Test</h1>
    
    <div class="test">
        <h3>Test Contact API</h3>
        <button onclick="testContact()">Test Contact Form</button>
        <div id="contactResult"></div>
    </div>

    <div class="test">
        <h3>Test Review API</h3>
        <button onclick="testReview()">Test Review Form</button>
        <div id="reviewResult"></div>
    </div>

    <script>
        async function testContact() {
            const resultDiv = document.getElementById('contactResult');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://72.60.103.43:5173/api/contact/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: 'Test User',
                        email: 'test@example.com',
                        phone: '+91-9876543210',
                        subject: 'Test Subject',
                        message: 'Test message'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'test success';
                    resultDiv.innerHTML = `<h4>✅ Success!</h4><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    resultDiv.className = 'test error';
                    resultDiv.innerHTML = `<h4>❌ Error (${response.status})</h4><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                resultDiv.className = 'test error';
                resultDiv.innerHTML = `<h4>❌ Network Error</h4><pre>${error.message}</pre>`;
            }
        }

        async function testReview() {
            const resultDiv = document.getElementById('reviewResult');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://72.60.103.43:5173/api/reviews/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: 'Test Reviewer',
                        email: 'reviewer@example.com',
                        overall_rating: 5,
                        category_ratings: {
                            communication: 5,
                            professionalism: 4,
                            response: 5
                        },
                        feedback_text: 'Great service!',
                        recommendation: 'yes'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'test success';
                    resultDiv.innerHTML = `<h4>✅ Success!</h4><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    resultDiv.className = 'test error';
                    resultDiv.innerHTML = `<h4>❌ Error (${response.status})</h4><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                resultDiv.className = 'test error';
                resultDiv.innerHTML = `<h4>❌ Network Error</h4><pre>${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
