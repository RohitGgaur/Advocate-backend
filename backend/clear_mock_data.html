<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Mock Data</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Clear Mock Data</h1>
        
        <div class="section info">
            <h3>📋 Current LocalStorage Status</h3>
            <div id="status"></div>
            <button onclick="checkStatus()">Check Status</button>
        </div>

        <div class="section">
            <h3>🧹 Clear Actions</h3>
            <button onclick="clearAllData()">Clear All LocalStorage</button>
            <button onclick="clearAdminData()">Clear Only Admin Data</button>
            <button onclick="setRealAdminData()">Set Real Admin Data</button>
        </div>

        <div class="section">
            <h3>📊 Results</h3>
            <div id="results"></div>
        </div>
    </div>

    <script>
        function showResult(message, isSuccess = true) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `section ${isSuccess ? 'success' : 'error'}`;
            resultDiv.innerHTML = `<p>${message}</p>`;
            resultsDiv.appendChild(resultDiv);
        }

        function checkStatus() {
            const statusDiv = document.getElementById('status');
            const adminData = localStorage.getItem('adminData');
            
            if (adminData) {
                try {
                    const parsed = JSON.parse(adminData);
                    const adminId = parsed._id || parsed.id;
                    
                    statusDiv.innerHTML = `
                        <h4>Current Admin Data:</h4>
                        <pre>${JSON.stringify(parsed, null, 2)}</pre>
                        <p><strong>Admin ID:</strong> ${adminId}</p>
                        <p><strong>ID Length:</strong> ${adminId ? adminId.length : 0} characters</p>
                        <p><strong>Is Mock Data:</strong> ${adminId === 'admin_123' ? 'YES ❌' : 'NO ✅'}</p>
                    `;
                } catch (error) {
                    statusDiv.innerHTML = `<p>Error parsing data: ${error.message}</p>`;
                }
            } else {
                statusDiv.innerHTML = '<p>No admin data found in localStorage</p>';
            }
        }

        function clearAllData() {
            localStorage.clear();
            showResult('✅ All localStorage data cleared successfully');
            checkStatus();
        }

        function clearAdminData() {
            localStorage.removeItem('adminData');
            showResult('✅ Admin data cleared successfully');
            checkStatus();
        }

        function setRealAdminData() {
            const realAdminData = {
                _id: '68c563623a278f13e1975998',
                username: 'Rohit Gaur',
                email: 'gaur0423@gmail.com',
                role: 'admin',
                is_active: true,
                createdAt: '2025-09-13T12:28:18.990+00:00',
                updatedAt: '2025-09-18T16:44:11.743+00:00',
                last_login: '2025-09-13T13:11:10.728+00:00'
            };

            localStorage.setItem('adminData', JSON.stringify(realAdminData));
            showResult('✅ Real admin data set successfully');
            checkStatus();
        }

        // Auto-check on page load
        window.onload = function() {
            checkStatus();
        };
    </script>
</body>
</html>
