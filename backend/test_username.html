<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username Update Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { padding: 10px; width: 100%; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Username Update Test</h1>
        
        <div class="form-group">
            <label for="adminId">Admin ID:</label>
            <input type="text" id="adminId" placeholder="Enter Admin ID (e.g., 68c563623a278f13e1975998)" value="68c563623a278f13e1975998">
        </div>
        
        <div class="form-group">
            <label for="newUsername">New Username:</label>
            <input type="text" id="newUsername" placeholder="Enter new username" value="UpdatedUser_123">
        </div>
        
        <div class="form-group">
            <label for="newEmail">New Email (Optional):</label>
            <input type="email" id="newEmail" placeholder="Enter new email" value="updated@example.com">
        </div>
        
        <button onclick="updateUsername()">🔄 Update Username</button>
        <button onclick="fetchAdmins()">📋 Fetch All Admins</button>
        
        <div id="result"></div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:5000';
        
        async function fetchAdmins() {
            try {
                const response = await fetch(`${BASE_URL}/api/admin/list`);
                const data = await response.json();
                
                if (data.success) {
                    let html = '<h3>📋 All Admins:</h3>';
                    data.admins.forEach(admin => {
                        html += `<div style="border: 1px solid #ddd; padding: 10px; margin: 5px 0; border-radius: 5px;">
                            <strong>ID:</strong> ${admin._id}<br>
                            <strong>Username:</strong> ${admin.username}<br>
                            <strong>Email:</strong> ${admin.email}<br>
                            <strong>Role:</strong> ${admin.role}<br>
                            <strong>Updated:</strong> ${new Date(admin.updatedAt).toLocaleString()}
                        </div>`;
                    });
                    document.getElementById('result').innerHTML = html;
                } else {
                    showResult('Error fetching admins: ' + data.message, 'error');
                }
            } catch (error) {
                showResult('Error: ' + error.message, 'error');
            }
        }
        
        async function updateUsername() {
            const adminId = document.getElementById('adminId').value;
            const newUsername = document.getElementById('newUsername').value;
            const newEmail = document.getElementById('newEmail').value;
            
            if (!adminId || !newUsername) {
                showResult('Please enter Admin ID and new username', 'error');
                return;
            }
            
            try {
                const updateData = {
                    username: newUsername
                };
                
                if (newEmail) {
                    updateData.email = newEmail;
                }
                
                const response = await fetch(`${BASE_URL}/api/admin/${adminId}/profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showResult(`✅ Success! ${data.message}<br><br>Updated Admin:<br>
                        <strong>Username:</strong> ${data.admin.username}<br>
                        <strong>Email:</strong> ${data.admin.email}<br>
                        <strong>Updated At:</strong> ${new Date(data.admin.updatedAt).toLocaleString()}`, 'success');
                } else {
                    showResult('❌ Error: ' + data.message, 'error');
                }
            } catch (error) {
                showResult('❌ Error: ' + error.message, 'error');
            }
        }
        
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = message;
            resultDiv.className = 'result ' + type;
        }
        
        // Auto-fetch admins on page load
        window.onload = function() {
            fetchAdmins();
        };
    </script>
</body>
</html>
