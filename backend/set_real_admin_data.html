<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Real Admin Data</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
        input { padding: 8px; margin: 5px; width: 300px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Set Real Admin Data</h1>
        
        <div class="section info">
            <h3>📋 Current LocalStorage</h3>
            <div id="currentData"></div>
            <button onclick="checkCurrentData()">Check Current Data</button>
            <button onclick="clearLocalStorage()">Clear LocalStorage</button>
        </div>

        <div class="section">
            <h3>🔧 Set Real Admin Data</h3>
            <div>
                <label>Admin ID (24 characters):</label><br>
                <input type="text" id="adminId" placeholder="68c563623a278f13e1975998" value="68c563623a278f13e1975998">
            </div>
            <div>
                <label>Username:</label><br>
                <input type="text" id="username" placeholder="Rohit Gaur" value="Rohit Gaur">
            </div>
            <div>
                <label>Email:</label><br>
                <input type="email" id="email" placeholder="gaur0423@gmail.com" value="gaur0423@gmail.com">
            </div>
            <div>
                <label>Role:</label><br>
                <input type="text" id="role" placeholder="admin" value="admin">
            </div>
            <div>
                <button onclick="setRealAdminData()">Set Real Admin Data</button>
                <button onclick="testWithRealData()">Test with Real Data</button>
            </div>
        </div>

        <div class="section">
            <h3>📊 Test Results</h3>
            <div id="results"></div>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://72.60.103.43:5000';
        let resultsElement = document.getElementById('results');

        function showResult(message, isSuccess = true) {
            const resultDiv = document.createElement('div');
            resultDiv.className = `section ${isSuccess ? 'success' : 'error'}`;
            resultDiv.innerHTML = `<p>${message}</p>`;
            resultsElement.appendChild(resultDiv);
        }

        function checkCurrentData() {
            const adminData = localStorage.getItem('adminData');
            const currentDataDiv = document.getElementById('currentData');
            
            if (adminData) {
                try {
                    const parsed = JSON.parse(adminData);
                    currentDataDiv.innerHTML = `
                        <h4>Current Admin Data:</h4>
                        <pre>${JSON.stringify(parsed, null, 2)}</pre>
                        <p><strong>Admin ID:</strong> ${parsed._id || parsed.id || 'NOT FOUND'}</p>
                        <p><strong>ID Length:</strong> ${(parsed._id || parsed.id || '').length} characters</p>
                    `;
                } catch (error) {
                    currentDataDiv.innerHTML = `<p>Error parsing data: ${error.message}</p>`;
                }
            } else {
                currentDataDiv.innerHTML = '<p>No admin data found in localStorage</p>';
            }
        }

        function clearLocalStorage() {
            localStorage.clear();
            showResult('✅ LocalStorage cleared successfully');
            checkCurrentData();
        }

        function setRealAdminData() {
            const adminId = document.getElementById('adminId').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const role = document.getElementById('role').value;

            if (!adminId || adminId.length !== 24) {
                showResult('❌ Admin ID must be exactly 24 characters', false);
                return;
            }

            const adminData = {
                _id: adminId,
                username: username,
                email: email,
                role: role,
                is_active: true,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                last_login: new Date().toISOString()
            };

            localStorage.setItem('adminData', JSON.stringify(adminData));
            showResult('✅ Real admin data set successfully');
            checkCurrentData();
        }

        async function testWithRealData() {
            const adminData = localStorage.getItem('adminData');
            if (!adminData) {
                showResult('❌ No admin data found. Set real admin data first.', false);
                return;
            }

            try {
                const admin = JSON.parse(adminData);
                const adminId = admin._id || admin.id;

                if (!adminId || adminId.length !== 24) {
                    showResult('❌ Invalid admin ID format', false);
                    return;
                }

                showResult('🔄 Testing API call with real admin ID...');

                const response = await fetch(`${BASE_URL}/api/admin/${adminId}`);
                const data = await response.json();

                if (response.ok) {
                    showResult(`✅ API call successful!<br><pre>${JSON.stringify(data, null, 2)}</pre>`);
                } else {
                    showResult(`❌ API call failed: ${response.status} - ${data.message}`, false);
                }

            } catch (error) {
                showResult(`❌ Error: ${error.message}`, false);
            }
        }

        // Auto-check on page load
        window.onload = function() {
            checkCurrentData();
        };
    </script>
</body>
</html>
